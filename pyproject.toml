[project]
name = "esci"
version = "0.1.0"
description = "Two-stage product search and ranking on Amazon ESCI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
retrieval = [
    "bm25s>=0.2",
    "PyStemmer>=2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
ranking = ["lightgbm>=4.3"]
eval = ["ranx>=0.3.19", "wandb>=0.17", "matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esci"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"